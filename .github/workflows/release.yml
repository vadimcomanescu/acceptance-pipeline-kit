name: release

# Cut a release by pushing a strict-semver tag (vMAJOR.MINOR.PATCH).
# The maintainer's `git tag vX.Y.Z && git push --tags` is the ONLY trigger;
# everything below runs in CI with the automatic GITHUB_TOKEN. No external
# secret (PyPI/npm/etc.) is referenced or required.
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write  # required to create the GitHub Release and upload assets

jobs:
  release:
    name: Build artifacts and publish GitHub Release
    runs-on: ubuntu-latest
    steps:
      # Third-party actions are pinned to a commit SHA (not a floating major tag)
      # so a tag repoint cannot change what runs. Trailing comment = human version.
      - name: Check out the repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: 'stable'

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'

      - name: Verify release tag matches TypeScript package version
        run: |
          PACKAGE_VERSION="$(node -p "require('./typescript/package.json').version")"
          EXPECTED_TAG="v$PACKAGE_VERSION"
          if [ "$GITHUB_REF_NAME" != "$EXPECTED_TAG" ]; then
            echo "release tag '$GITHUB_REF_NAME' must match typescript/package.json version '$PACKAGE_VERSION' (expected '$EXPECTED_TAG')" >&2
            exit 1
          fi

      # The builder cross-compiles BOTH gherkin-parser and gherkin-mutator for
      # all four supported targets (darwin/amd64, darwin/arm64, linux/amd64,
      # linux/arm64), packages each with the attribution NOTICE, and writes a
      # single dist/checksums.txt. It is the single producer of these artifacts,
      # so the archive naming + checksums format cannot drift from the fixtures.
      - name: Build release archives + checksums
        env:
          APS_RELEASE_VERSION: ${{ github.ref_name }}
        run: sh scripts/build-release-artifacts.sh dist

      # The TypeScript tarball rides the same Release so consumers can install
      # @aps-kit/typescript with no clone and no npm token (AC-008). Build dist/
      # first so the packed tarball is runnable.
      - name: Build and pack the TypeScript tarball
        working-directory: typescript
        run: |
          # package-lock.json is gitignored in this repo, so use `npm install`
          # (not `npm ci`, which requires a committed lockfile).
          npm install
          npm run build
          npm pack --pack-destination ../dist

      - name: List artifacts
        run: ls -la dist

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3.0.0
        with:
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
