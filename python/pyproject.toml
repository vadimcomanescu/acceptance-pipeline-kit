[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aps-kit"
version = "0.1.0"
description = "Python scaffolding for the Acceptance Pipeline Specification"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Vadim Comanescu" }]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
aps-generate = "aps_kit.generator_cli:main"
aps-adapter = "aps_kit.adapter_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
