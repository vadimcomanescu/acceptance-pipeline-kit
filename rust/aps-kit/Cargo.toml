[package]
name = "aps-kit"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Rust scaffolding for the Acceptance Pipeline Specification"

[lib]
path = "src/lib.rs"

[[bin]]
name = "acceptance-entrypoint-generator"
path = "src/bin/acceptance-entrypoint-generator.rs"

[[bin]]
name = "aps-adapter"
path = "src/bin/aps-adapter.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
once_cell = "1"
